services:
  db:
    image: postgres:16-alpine
    container_name: under-clothing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: under
      POSTGRES_PASSWORD: under
      POSTGRES_DB: under_clothing
    ports:
      - "5433:5432"
    volumes:
      - under_clothing_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U under -d under_clothing"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  under_clothing_pg:
